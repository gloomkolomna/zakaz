# СобериЗаказ — добавить в инклюд-файл домена belovolovhome.ru.
# FastPanel2: /etc/nginx/fastpanel2-sites/belovolovhom_usr/belovolovhome.ru.includes
# После добавления: nginx -t && systemctl reload nginx

location = /zakaz {
    return 301 /zakaz/;
}

location ^~ /zakaz/api/ {
    proxy_pass http://127.0.0.1:8006/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# Хэшированные ассеты Vite: кэшируем агрессивно.
location ^~ /zakaz/assets/ {
    alias /opt/zakaz/frontend/dist/assets/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    gzip_static on;
}

location ^~ /zakaz/ {
    alias /opt/zakaz/frontend/dist/;
    try_files $uri @zakaz_spa;
    gzip_static on;
}

# index.html без кэша: после деплоя браузер сразу забирает свежие хэши чанков.
location = /zakaz/index.html {
    alias /opt/zakaz/frontend/dist/index.html;
    add_header Cache-Control "no-cache";
}

location @zakaz_spa {
    root /opt/zakaz/frontend/dist;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}
