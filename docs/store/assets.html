<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>СобериЗаказ — store assets</title>
<link rel="stylesheet" href="../design-preview/fonts/fonts-local.css">
<style>
  :root {
    --paper: #f4f5f1;
    --ink: #1a201b;
    --ink-2: #4c544e;
    --muted: #68716a;
    --red: #b02a21;
    --line: #e1e3dc;
    --wood: #8b6e4e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: 'Golos Text', sans-serif; }
  .stage { position: relative; overflow: hidden; background: var(--paper); }
  .stage svg.grid { position: absolute; inset: 0; width: 100%; height: 100%; }

  .icon { width: 576px; height: 576px; display: grid; place-items: center; }
  .icon .mark { color: var(--red); width: 380px; height: 380px; }

  .snippet { width: 1120px; height: 630px; padding: 72px; }
  .snippet .brand { display: flex; align-items: center; gap: 16px; font-family: 'Literata', Georgia, serif; font-size: 40px; font-weight: 600; letter-spacing: -0.01em; }
  .snippet .brand svg { color: var(--red); width: 56px; height: 56px; }
  .snippet h1 { font-family: 'Literata', Georgia, serif; font-size: 62px; line-height: 1.12; font-weight: 600; letter-spacing: -0.02em; margin: 54px 0 0; max-width: 620px; }
  .snippet p { margin: 24px 0 0; font-size: 22px; line-height: 1.5; color: var(--ink-2); max-width: 540px; }
  .snippet .thread { position: absolute; left: 72px; bottom: 74px; width: 240px; height: 3px; background: var(--red); border-radius: 2px; opacity: 0.9; }
  .snippet .art { position: absolute; right: 72px; top: 72px; width: 360px; height: 450px; }
  .snippet .art svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    const LOGO = `<svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M18.6 4.7 10.8 12.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      <ellipse cx="18.1" cy="4.2" rx="0.85" ry="1.35" transform="rotate(-45 18.1 4.2)" fill="none" stroke="currentColor" stroke-width="1.05"/>
      <path d="M17.6 4.9C16.2 2.4 13.2 2 11.7 3.6c-1.1 1.2-.8 3 .5 3.6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M4.6 15.2 9.4 20M9.4 15.2 4.6 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>`;

    const GRID = `<svg class="grid" aria-hidden="true">
      <defs>
        <pattern id="aida" width="24" height="24" patternUnits="userSpaceOnUse">
          <path d="M24 0H0V24" fill="none" stroke="#e9eae2" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#aida)"/>
    </svg>`;

    function rng(seed) {
      let s = seed >>> 0;
      return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
    }

    function chartSvg() {
      const cols = 20, rows = 25, cell = 10;
      const w = cols * cell, h = rows * cell;
      const palette = ['#c97b84', '#7c9a6d', '#d3a23f'];
      const r = rng(11);
      const done = 0.92;
      let cells = '';
      const stitch = (x, y, c) =>
        `<rect x="${x * cell + 2.5}" y="${y * cell + 2.5}" width="${cell - 5}" height="${cell - 5}" fill="${c}"/>`;
      for (let y = 0; y < rows; y++) {
        const t = y / rows;
        const cut = t < done ? cols : Math.max(0, Math.round(cols * (1 - (t - done) / (1 - done))));
        const hue = palette[Math.floor(y / 3) % palette.length];
        for (let x = 0; x < cut; x++) {
          if (r() > 0.04) cells += stitch(x, y, hue);
        }
      }
      let d = '';
      for (let x = 1; x < cols; x++) d += `M${x * cell} 0V${h}`;
      for (let y = 1; y < rows; y++) d += `M0 ${y * cell}H${w}`;
      return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Вышитый трекер в рамке">
        <rect width="${w}" height="${h}" fill="#ffffff"/>
        <path d="${d}" stroke="#e7e8e0" stroke-width="1" fill="none"/>
        ${cells}
        <rect x="4" y="4" width="${w - 8}" height="${h - 8}" fill="none" stroke="#8b6e4e" stroke-width="8"/>
      </svg>`;
    }

    const asset = new URLSearchParams(location.search).get('a') || 'icon';
    const root = document.getElementById('root');

    if (asset === 'icon') {
      root.innerHTML = `<div class="stage icon">${LOGO}</div>`;
    } else {
      root.innerHTML = `<div class="stage snippet">
        ${GRID}
        <div class="brand">${LOGO}<span>СобериЗаказ</span></div>
        <h1>Наборы для вышивки</h1>
        <p>Трекеры на год и для хобби. Собираете набор по шагам — цена складывается сама.</p>
        <div class="art">${chartSvg()}</div>
      </div>`;
    }
  </script>
</body>
</html>
