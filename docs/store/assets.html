<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Магазин игр — store assets</title>
<link rel="stylesheet" href="../design-preview/fonts/fonts-local.css">
<style>
  :root {
    --paper: #f4f5f1;
    --ink: #1a201b;
    --ink-2: #4c544e;
    --muted: #68716a;
    --red: #b02a21;
    --line: #e1e3dc;
    --wood: #8b6e4e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: 'Golos Text', sans-serif; }
  .stage { position: relative; overflow: hidden; background: var(--paper); }
  .stage svg.grid { position: absolute; inset: 0; width: 100%; height: 100%; }

  .icon { width: 576px; height: 576px; display: grid; place-items: center; }
  .icon .mark { width: 576px; height: 576px; object-fit: cover; }

  .snippet { width: 1120px; height: 630px; padding: 72px; }
  .snippet .brand { display: flex; align-items: center; gap: 16px; font-family: 'Literata', Georgia, serif; font-size: 40px; font-weight: 600; letter-spacing: -0.01em; }
  .snippet .brand .brand-logo { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; }
  .snippet h1 { font-family: 'Literata', Georgia, serif; font-size: 62px; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em; margin: 48px 0 0; max-width: 580px; }
  .snippet p { margin: 22px 0 0; font-size: 21px; line-height: 1.5; color: var(--ink-2); max-width: 540px; }
  .snippet .items { position: absolute; right: 72px; top: 78px; width: 392px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .snippet .item { background: #ffffff; border: 1px solid var(--line); border-radius: 8px; height: 228px; display: grid; place-items: center; }
  .snippet .item svg { width: 150px; height: 170px; display: block; }
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    const LOGO = `<img class="mark brand-logo" src="./logo-source.png" alt="" aria-hidden="true">`;

    const GRID = `<svg class="grid" aria-hidden="true">
      <defs>
        <pattern id="aida" width="24" height="24" patternUnits="userSpaceOnUse">
          <path d="M24 0H0V24" fill="none" stroke="#e9eae2" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#aida)"/>
    </svg>`;

    function rng(seed) {
      let s = seed >>> 0;
      return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
    }

    function chartSvg(done = 0.92) {
      const cols = 18, rows = 22, cell = 8;
      const w = cols * cell, h = rows * cell;
      const palette = ['#c97b84', '#7c9a6d', '#d3a23f'];
      const r = rng(11);
      let cells = '';
      const stitch = (x, y, c) =>
        `<rect x="${x * cell + 2}" y="${y * cell + 2}" width="${cell - 4}" height="${cell - 4}" fill="${c}"/>`;
      for (let y = 0; y < rows; y++) {
        const t = y / rows;
        const cut = t < done ? cols : Math.max(0, Math.round(cols * (1 - (t - done) / (1 - done))));
        const hue = palette[Math.floor(y / 3) % palette.length];
        for (let x = 0; x < cut; x++) {
          if (r() > 0.05) cells += stitch(x, y, hue);
        }
      }
      let d = '';
      for (let x = 1; x < cols; x++) d += `M${x * cell} 0V${h}`;
      for (let y = 1; y < rows; y++) d += `M0 ${y * cell}H${w}`;
      return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <rect width="${w}" height="${h}" fill="#ffffff"/>
        <path d="${d}" stroke="#e7e8e0" stroke-width="1" fill="none"/>
        ${cells}
        <rect x="3" y="3" width="${w - 6}" height="${h - 6}" fill="none" stroke="#8b6e4e" stroke-width="6"/>
      </svg>`;
    }

    function bookSvg() {
      return `<svg viewBox="0 0 120 140" fill="none" aria-hidden="true">
        <rect x="20" y="12" width="72" height="112" rx="2" fill="#1a201b"/>
        <rect x="92" y="16" width="5" height="104" fill="#ffffff" stroke="#e1e3dc" stroke-width="1"/>
        <path d="M34 12v34l7-5 7 5V12" fill="#b02a21"/>
        <rect x="30" y="22" width="52" height="92" stroke="#b02a21" stroke-width="1.2" stroke-dasharray="2 3"/>
        <g fill="#c97b84">
          <rect x="42" y="48" width="4" height="4"/><rect x="54" y="48" width="4" height="4"/><rect x="66" y="48" width="4" height="4"/>
          <rect x="48" y="54" width="4" height="4"/><rect x="60" y="54" width="4" height="4"/>
          <rect x="42" y="60" width="4" height="4"/><rect x="54" y="60" width="4" height="4"/><rect x="66" y="60" width="4" height="4"/>
        </g>
        <g fill="#d3a23f">
          <rect x="42" y="70" width="4" height="4"/><rect x="54" y="70" width="4" height="4"/><rect x="66" y="70" width="4" height="4"/>
          <rect x="48" y="76" width="4" height="4"/><rect x="60" y="76" width="4" height="4"/>
        </g>
      </svg>`;
    }

    function calendarSvg() {
      let cells = '';
      for (let y = 0; y < 5; y++) {
        for (let x = 0; x < 7; x++) {
          cells += `<rect x="${18 + x * 13}" y="${42 + y * 13}" width="9" height="9" fill="none" stroke="#e1e3dc" stroke-width="1"/>`;
        }
      }
      return `<svg viewBox="0 0 120 140" fill="none" aria-hidden="true">
        <rect x="10" y="20" width="100" height="102" rx="2" fill="#ffffff" stroke="#e1e3dc" stroke-width="1.5"/>
        <rect x="10" y="20" width="100" height="16" rx="2" fill="#1a201b"/>
        <path d="M22 20v-6M98 20v-6" stroke="#b02a21" stroke-width="3" stroke-linecap="round"/>
        ${cells}
        <circle cx="50" cy="86" r="7" stroke="#b02a21" stroke-width="2"/>
        <path d="M46 86l3 3 5-6" stroke="#b02a21" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
    }

    function gameSvg() {
      let cells = '';
      for (let y = 1; y < 6; y++) cells += `<path d="M18 ${20 + y * 15}H102" stroke="#e7e8e0" stroke-width="1"/>`;
      for (let x = 1; x < 6; x++) cells += `<path d="M${18 + x * 14} 20V110" stroke="#e7e8e0" stroke-width="1"/>`;
      return `<svg viewBox="0 0 120 140" fill="none" aria-hidden="true">
        <rect x="18" y="20" width="84" height="90" rx="2" fill="#ffffff" stroke="#e1e3dc" stroke-width="1.5"/>
        ${cells}
        <path d="M25 92h14v-14h14v-14h14v-14h14" stroke="#b02a21" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="81" cy="50" r="5" fill="#b02a21"/>
        <circle cx="39" cy="100" r="5" fill="#1a201b"/>
        <rect x="74" y="96" width="16" height="16" rx="2" fill="#ffffff" stroke="#1a201b" stroke-width="1.5"/>
        <circle cx="78" cy="100" r="1.5" fill="#1a201b"/><circle cx="86" cy="100" r="1.5" fill="#1a201b"/>
        <circle cx="82" cy="104" r="1.5" fill="#1a201b"/><circle cx="78" cy="108" r="1.5" fill="#1a201b"/><circle cx="86" cy="108" r="1.5" fill="#1a201b"/>
      </svg>`;
    }

    function trackerSvg() {
      const inner = chartSvg();
      const body = inner.replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '');
      return `<svg viewBox="0 0 120 140" fill="none" aria-hidden="true">
        <g transform="translate(15 16) scale(0.62)">${body}</g>
      </svg>`;
    }

    const asset = new URLSearchParams(location.search).get('a') || 'icon';
    const root = document.getElementById('root');

    if (asset === 'icon') {
      root.innerHTML = `<div class="stage icon">${LOGO}</div>`;
    } else {
      root.innerHTML = `<div class="stage snippet">
        ${GRID}
        <div class="brand">${LOGO}<span>Магазин игр</span></div>
        <h1>Всё для вышивальщиц</h1>
        <p>Блокноты, календари, настольные игры и трекеры. Собираете свой набор по шагам — цена складывается сама.</p>
        <div class="items">
          <div class="item">${bookSvg()}</div>
          <div class="item">${calendarSvg()}</div>
          <div class="item">${gameSvg()}</div>
          <div class="item">${trackerSvg()}</div>
        </div>
      </div>`;
    }
  </script>
</body>
</html>
